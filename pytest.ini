[pytest]
# environment.yaml stays the single source of truth for dependencies.
# This file only configures the test runner.
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning:uszipcode.*
    # plotly 6 renamed scatter_mapbox -> scatter_map and scattermapbox -> scattermap.
    # src/utils/viz.py:visualize_st_dbscan_clusters still uses the old names; the
    # warning fires ~15 times per call and drowns out everything else. Remove this
    # line once viz.py migrates.
    ignore:\*scatter.?mapbox\* is deprecated:DeprecationWarning
markers =
    slow: takes more than a second or two
    notimplemented: placeholder for a module that does not exist yet (src/ml, src/statistical, src/dynamical, src/ensemble)
